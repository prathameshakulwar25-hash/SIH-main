name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    env:
      ENV_MODE: development
      JWT_SECRET: ci-test-secret-key-min-32-chars-jeevan-opd
      PHYSICIAN_PIN: "1234"
      DATABASE_URL: sqlite:///./data/ayush.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: |
          ruff check backend/

      - name: Run backend tests with pytest
        run: |
          cd backend
          pytest tests/ -v

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests/linter
        run: |
          cd frontend
          npm run test

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
