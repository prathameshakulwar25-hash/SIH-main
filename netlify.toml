# Netlify configuration for Jeevan Health monorepo
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# API Reverse Proxy (Transparently routes /api/* to Render, eliminates CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://sih-main-b6mx.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://sih-main-b6mx.onrender.com"

